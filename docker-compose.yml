version: '3.9'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LQRP_LLM_PROVIDER=${LQRP_LLM_PROVIDER:-mock}
      - LQRP_OPENAI_API_KEY=${LQRP_OPENAI_API_KEY:-}
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
